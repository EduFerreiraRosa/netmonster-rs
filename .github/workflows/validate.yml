name: Validar base
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar regras
        run: node --test tests/validate.test.mjs
      - name: Validar dados e procedência
        run: node scripts/validate.mjs
